# Job tracker configuration.
#
# Path to your existing job log. Can be overridden with --log.
log_path = "~/JobTracker/JobStuff/Job_Search_Log.xlsx"

[settings]
max_results_per_source = 50   # per keyword, for sources that search by keyword
max_pages = 3                 # for sources that page through all listings
max_days_old = 30             # skip postings older than this (when the source gives a date)
adzuna_country = "us"

# Sources to use. Adzuna, Jooble and USAJobs only run when their API keys are
# set (see README); otherwise they are skipped with a message.
# "arbeitnow" is also available but is almost all European jobs, so it's off.
sources = ["remotive", "remoteok", "themuse", "jobicy", "himalayas", "weworkremotely",
           "workingnomads", "hackernews", "companies", "adzuna", "jooble", "usajobs"]

# Employers whose own job boards are checked directly ("companies" source).
# The name is the part of the board's URL after the domain, e.g.
#   job-boards.greenhouse.io/submittable  -> "submittable"
#   jobs.lever.co/entrata                 -> "entrata"
#   jobs.ashbyhq.com/elevenlabs           -> "elevenlabs"
# These came from your job log. Add any company you'd like watched.
[settings.companies]
greenhouse = ["submittable", "perfectserve", "newsela", "assetwatch", "arive", "calendly",
              "syllo", "alertmedia", "lightspeedsystems", "renewedvision", "openeye",
              "opentable", "degreed", "heartflowinc", "striveworks"]
lever = ["entrata", "easypost-2", "aircall", "heard", "getfivestar", "foodsmart", "lwolf"]
ashby = ["elevenlabs"]

# How to show a company when its board name isn't its real name.
[settings.companies.names]
easypost-2 = "EasyPost"
getfivestar = "Five Star Solutions"
lwolf = "Lone Wolf Technologies"
arive = "ARIVE"
alertmedia = "AlertMedia"
assetwatch = "AssetWatch"
lightspeedsystems = "Lightspeed Systems"
renewedvision = "Renewed Vision"
openeye = "OpenEye"
opentable = "OpenTable"
perfectserve = "PerfectServe"
heartflowinc = "HeartFlow"
elevenlabs = "ElevenLabs"

# Location words shared by both searches.
[locations]
# Places within ~30 miles of ZIP 78660 (Pflugerville).
local_terms = ["Pflugerville", "Austin", "Round Rock", "Cedar Park", "Georgetown",
               "Hutto", "Leander", "Manor", "Taylor", "Elgin", "Kyle", "Buda", "Lakeway"]
texas_terms = ["Texas", "TX"]
us_terms = ["US", "USA", "U.S.", "United States", "America", "Americas", "North America",
            "Anywhere", "Worldwide", "Global"]

# ---------------------------------------------------------------------------
# Search 1: Remote tech support / customer service
# Work from home only; part-time, full-time, temporary and contract all OK.
# ---------------------------------------------------------------------------
[[categories]]
name = "Support"
remote_only = true
search_keywords = ["technical support", "customer support", "customer service", "help desk"]
title_include = ["technical support", "tech support", "customer support", "customer service",
                 "customer success associate", "help desk", "helpdesk", "service desk",
                 "support specialist", "support representative", "support agent",
                 "support engineer", "support analyst", "support associate",
                 "member support", "client support", "call center"]
title_exclude = ["lead", "manager", "director", "supervisor", "head of", "vp", "vice president",
                 "team lead", "bilingual", "product engineer"]
muse_categories = ["Customer Service"]
wwr_categories = ["remote-customer-support-jobs"]
muse_locations = ["Flexible / Remote"]
search_location = ""

# ---------------------------------------------------------------------------
# Search 2: Software engineering
# Priority: Software Developer/Engineer, then Senior SWE, then entry-level QA,
# then technical sales (Sales/Solutions Engineer). Remote nationwide, or
# on-site/hybrid within 30 miles of 78660. No Lead roles.
# ---------------------------------------------------------------------------
[[categories]]
name = "Software Engineering"
remote_only = false
search_keywords = ["software engineer", "software developer", "programmer", "java",
                   "spring boot", "full stack", "qa engineer", "sales engineer"]
title_include = ["software engineer", "software developer", "backend engineer",
                 "back end engineer", "back-end engineer", "full stack", "fullstack",
                 "java developer", "java engineer", "spring boot", "frontend engineer",
                 "front end engineer", "application developer", "web developer",
                 "qa engineer", "quality engineer", "quality assurance", "test engineer",
                 "sdet", "software tester", "sales engineer", "solutions engineer",
                 # Common in government job titles:
                 "programmer", "programmer analyst", "appsw", "computer scientist"]
title_exclude = ["lead", "tech lead", "team lead", "manager", "director", "head of",
                 "vp", "vice president", "intern", "principal", "staff", "architect",
                 # "Programmer" titles that aren't software development:
                 "cmm", "cnc", "edm", "plc", "metrology", "machinist", "sas programmer",
                 "statistical programmer", "bas programmer", "clinical programmer",
                 "clinical", "sdtm", "database programmer", "systems programmer",
                 "producer", "data scientist", "bilingual"]
# Résumé-based filtering (see filters.skills_check). A job is dropped when its
# title names an avoid_skills stack and none of my_skills, when its description
# is about an avoid_skills stack with none of my_skills, or when a full
# description (600+ characters) mentions none of my_skills.
my_skills = ["java", "spring", "spring boot", "hibernate", "jpa", "j2ee", "jakarta ee",
             "microservices", "typescript", "javascript", "react", "angular", "svelte",
             "node.js", "nodejs", "c#", ".net", "asp.net", "kafka", "rabbitmq", "junit",
             "cobol", "mainframe", "full stack", "full-stack", "fullstack"]
avoid_skills = ["c++", "c/c++", "rust", "golang", "go developer", "go engineer", "python",
                "django", "flask", "ruby", "rails", "php", "laravel", "scala", "perl",
                "elixir", "erlang", "haskell", "clojure", "swift", "ios", "android",
                "flutter", "embedded", "firmware", "fpga", "vlsi", "asic", "rtl", "verilog",
                "kernel", "cuda", "machine learning", "ml engineer", "data scientist",
                "salesforce", "apex", "sap", "abap", "servicenow", "appian",
                "power platform", "dynamics 365", "unity", "unreal", "solidity"]
skills_exempt_titles = ["qa", "quality", "test", "tester", "sdet", "sales engineer",
                        "solutions engineer"]
skills_min_description = 600

# Skip jobs that pay more than this per year. Hourly and monthly pay is
# converted to yearly. salary_cutoff = "top" drops a job when the TOP of its
# range is over the limit ($122k-$240k is dropped); "bottom" drops it only when
# the whole range is over ($122k-$240k is kept). Jobs with no pay listed are kept.
salary_max = 160000
salary_cutoff = "top"
muse_categories = ["Software Engineering"]
wwr_categories = ["remote-full-stack-programming-jobs", "remote-back-end-programming-jobs",
                  "remote-front-end-programming-jobs"]
muse_locations = ["Flexible / Remote", "Austin, TX"]
search_location = "Austin, TX"
